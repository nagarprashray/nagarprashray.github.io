<footer>
  {% assign profile = site.data.portfolio.profile %}
  <div class="wrap footer-inner">
    <span>&copy; {{ "now" | date: "%Y" }} {{ profile.name }}</span>
    <span>{{ profile.location }}</span>
    <a href="mailto:{{ profile.email }}">{{ profile.email }}</a>
    <a href="{{ profile.github_url }}" rel="me">GitHub</a>
    <a href="{{ profile.linkedin_url }}" rel="me">LinkedIn</a>
  </div>
</footer>
